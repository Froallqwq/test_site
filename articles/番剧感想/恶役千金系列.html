<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>恶役千金系列 · 冰宝的个人空间</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { background: #f8fafc; }
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .anime-card {
            background: white;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #f1f5f9;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .anime-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -12px rgba(14,165,233,0.2);
        }
        .anime-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 2px solid #e2e8f0;
        }
        .anime-card .info {
            padding: 1.2rem 1.5rem 1.5rem;
        }
        .anime-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        .anime-card p {
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 0.25rem;
        }
        .anime-card .rank {
            color: #f59e0b;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 0.3rem;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #64748b;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
            font-size: 0.95rem;
        }
        .back-link:hover { color: #0ea5e9; }
        .dark body { background: #0f172a; }
        .dark .anime-card { background: #1e293b; border-color: #334155; }
        .dark .anime-card h3 { color: #f1f5f9; }
        .dark .anime-card p { color: #cbd5e1; }
        .dark .back-link { color: #94a3b8; }
        .dark .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body class="dark:bg-gray-900">
    <div class="max-w-6xl mx-auto px-4 py-10">

        <!-- 返回按钮 -->
        <a href="../../articles.html?category=番剧感想" class="back-link">

        <h1 class="text-3xl md:text-4xl font-serif font-bold text-gray-800 dark:text-gray-100 mb-2">
            🎬 恶役千金题材番剧总览
        </h1>
        <p class="text-gray-500 dark:text-gray-400 mb-6">个人向感想 · 对比 · 排名</p>

        <div class="anime-grid">

            <!-- 卡片 1 -->
            <div class="anime-card">
                <img src="../../images/番剧/身为悲剧始作俑者的最强邪恶BOSS女王为民竭心尽力第二季.webp" alt="身为悲剧始作俑者的最强邪恶BOSS女王为民竭心尽力第二季" />
                <div class="info">
                    <h3>身为悲剧始作俑者的最强邪恶BOSS女王为民竭心尽力第二季</h3>

                    <p>对比：与番剧B相比...</p>
                    <p class="rank">⭐️⭐️⭐️</p>
                </div>
            </div>

            <!-- 卡片 2 -->
            <div class="anime-card">
                <img src="../../images/番剧/最后可以再拜托您一件事吗？.webp" alt="最后可以再拜托您一件事吗？" />
                <div class="info">
                    <h3>最后可以再拜托您一件事吗？</h3>
                    <p>感想：战斗爽</p>
                    <p>对比：与番剧B相比...</p>
                    <p class="rank">⭐️⭐️⭐️⭐️⭐️</p>

            <!-- 以后新增卡片直接在这里复制粘贴即可 -->

        </div>

        <div class="mt-10 pt-6 border-t border-gray-200 dark:border-gray-700 text-sm text-gray-400">
            <p>📌 持续更新中 ...</p>
        </div>
    </div>
</body>
</html>
