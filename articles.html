<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章列表 · 冰宝的个人空间</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- 悠哉字体 -->
    <link href="https://cdn.jsdelivr.net/npm/cn-fontsource-yozai-regular@1.0.0/index.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

    <!-- ===== 新增：引用外部文章数据 ===== -->
    <script src="js/articles-data.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9',
                        secondary: '#7dd3fc',
                    },
                    fontFamily: {
                        serif: ['Noto Serif SC', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #b9d6f0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #7bb8e0; }

        #navbar {
            transition: box-shadow 0.3s ease, background 0.3s ease;
        }
        #navbar.scrolled {
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(8px);
        }
        .dark #navbar.scrolled {
            background: rgba(30, 41, 59, 0.85);
        }

        /* ===== 悠哉字体应用到标题 ===== */
        h1, h2, h3, .article-card h3, .article-card .font-serif {
            font-family: 'Yozai', 'Noto Serif SC', serif;
        }

        .article-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0,0,0,0.12);
        }

        .modal-overlay {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
        }
        .modal-box {
            max-width: 500px;
            width: 90%;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .dark .modal-box {
            background: #1e293b;
            color: #e2e8f0;
        }
        .modal-box p {
            color: #475569;
            line-height: 1.7;
        }
        .dark .modal-box p {
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- ========== 导航栏 ========== -->
    <nav id="navbar" class="fixed top-0 left-0 w-full z-50 bg-white/70 dark:bg-gray-900/70 backdrop-blur-sm border-b border-gray-100/50 dark:border-gray-800/50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <a href="index.html" class="text-2xl font-serif font-bold text-primary flex items-center gap-2">
                <i class="fa-regular fa-pen-to-square"></i> 冰宝的个人空间
            </a>
            <div class="flex items-center gap-4">
                <button id="themeToggle" class="text-gray-600 dark:text-gray-300 text-sm flex items-center gap-1 hover:text-primary transition">
                    <i class="fa-regular fa-moon" id="themeIcon"></i> <span id="themeLabel">夜间</span>
                </button>
                <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
                    <a href="index.html#about" class="text-gray-600 dark:text-gray-300 hover:text-primary transition">关于我</a>
                    <a href="articles.html" class="text-primary font-medium">文章</a>
                    <a href="index.html#contact" class="text-gray-600 dark:text-gray-300 hover:text-primary transition">联系</a>
                </div>
                <button id="menuBtn" class="md:hidden text-gray-600 dark:text-gray-300 text-xl">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
        <div id="mobileMenu" class="md:hidden hidden bg-white/90 dark:bg-gray-900/90 backdrop-blur-sm border-t border-gray-100 dark:border-gray-800 px-4 py-3 space-y-2 text-sm font-medium">
            <a href="index.html#about" class="block text-gray-600 dark:text-gray-300 hover:text-primary py-1">关于我</a>
            <a href="articles.html" class="block text-primary font-medium py-1">文章</a>
            <a href="index.html#contact" class="block text-gray-600 dark:text-gray-300 hover:text-primary py-1">联系</a>
        </div>
    </nav>

    <!-- ========== 页面标题 ========== -->
    <header class="pt-24 pb-12 md:pt-32 md:pb-16 bg-gradient-to-r from-sky-50 to-blue-50 dark:from-gray-800 dark:to-gray-700">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-serif font-bold text-gray-800 dark:text-gray-100 mb-4" data-aos="fade-down">文章列表</h1>
            <p class="text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto" data-aos="fade-up" data-aos-delay="100">
                探索生活中的美好与思考，记录每一个值得分享的瞬间
            </p>
        </div>
    </header>

    <!-- ========== 搜索与筛选 ========== -->
    <div class="bg-white dark:bg-gray-800 py-6 border-b border-gray-100 dark:border-gray-700">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-grow">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="搜索文章..." class="w-full pl-10 pr-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2">
                    <select id="categoryFilter" class="px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-gray-700">
                        <option value="">所有分类</option>
                        <option value="随笔">随笔</option>
                        <option value="小说">小说</option>
                        <option value="书评">书评</option>
                        <option value="番剧感想">番剧感想</option>
                        <option value="番剧汇总">番剧汇总</option>
                        <option value="游戏角色Wiki">游戏角色Wiki</option>
                        <option value="游戏介绍">游戏介绍</option>
                    </select>
                    <button id="sortBtn" class="px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 rounded-md bg-white hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-primary">
                        <i class="fa-solid fa-sort mr-1"></i> 排序
                    </button>
                </div>
            </div>
            <!-- 排序下拉菜单 -->
            <div id="sortDropdown" class="hidden absolute mt-2 bg-white dark:bg-gray-800 shadow-lg rounded-md py-2 z-10 border dark:border-gray-700">
                <button class="sort-option w-full text-left px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" data-sort="date-desc">最新发布</button>
                <button class="sort-option w-full text-left px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" data-sort="date-asc">最早发布</button>
                <button class="sort-option w-full text-left px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" data-sort="title-asc">标题 A-Z</button>
                <button class="sort-option w-full text-left px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" data-sort="title-desc">标题 Z-A</button>
            </div>
        </div>
    </div>

    <!-- ========== 文章列表 ========== -->
    <section class="py-12 bg-gray-50 dark:bg-gray-900">
        <div class="container mx-auto px-4">
            <div id="articlesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- 由 JavaScript 动态渲染 -->
            </div>
            <div class="text-center mt-12">
                <button id="loadMoreBtn" class="bg-white dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 text-primary dark:text-gray-200 border border-primary dark:border-gray-600 px-6 py-3 rounded-md transition-colors hidden">
                    加载更多
                </button>
            </div>
        </div>
    </section>

    <!-- ========== 页脚 ========== -->
    <footer class="bg-gray-900 text-white py-8 px-4">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center text-sm text-gray-400">
            <p>&copy; 2026 冰宝的个人空间 · 行动胜过万全</p>
            <div class="flex gap-6 mt-3 md:mt-0">
                <a href="#" id="privacyLink" class="hover:text-white transition">隐私政策</a>
                <a href="#" id="termsLink" class="hover:text-white transition">使用条款</a>
            </div>
        </div>
    </footer>

    <!-- ========== 法律弹窗 ========== -->
    <div id="legalModal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay hidden">
        <div class="modal-box">
            <div class="flex justify-between items-start mb-4">
                <h3 id="modalTitle" class="text-xl font-bold">隐私政策</h3>
                <button id="closeModal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-2xl leading-none">&times;</button>
            </div>
            <div id="modalBody">
                <p>本网站不收集、存储或分享任何用户个人信息。所有访问数据仅用于统计分析，不会与第三方共享。</p>
                <p>我们使用 Cookie 来提升用户体验，但不会用于追踪个人身份。</p>
            </div>
            <button id="closeModalBtn" class="mt-4 px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 transition">我知道了</button>
        </div>
    </div>

    <!-- ========== 音乐播放器（原样保留） ========== -->
    <div style="position:fixed; bottom:20px; right:20px; z-index:1000;">
        <script src="https://myhkw.cn/player/js/jquery.min.js" type="text/javascript"></script>
        <script src="https://myhkw.cn/api/player/demo" id="myhk" key="demo" m="1"></script>
    </div>

    <!-- ========== JavaScript ========== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ---------- 夜间模式 ----------
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');
            const html = document.documentElement;

            function setTheme(theme) {
                if (theme === 'dark') {
                    html.classList.add('dark');
                    themeIcon.className = 'fa-regular fa-sun';
                    themeLabel.textContent = '白天';
                } else {
                    html.classList.remove('dark');
                    themeIcon.className = 'fa-regular fa-moon';
                    themeLabel.textContent = '夜间';
                }
                localStorage.setItem('theme', theme);
            }
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme('dark');
            }
            themeToggle.addEventListener('click', function() {
                const isDark = html.classList.contains('dark');
                setTheme(isDark ? 'light' : 'dark');
            });

            // ---------- 导航栏滚动阴影 ----------
            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 30) navbar.classList.add('scrolled');
                else navbar.classList.remove('scrolled');
            });

            // ---------- 移动端菜单 ----------
            const menuBtn = document.getElementById('menuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
            document.querySelectorAll('#mobileMenu a').forEach(link => {
                link.addEventListener('click', () => mobileMenu.classList.add('hidden'));
            });

            // ---------- 法律弹窗 ----------
            const modal = document.getElementById('legalModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const closeModal = document.getElementById('closeModal');
            const closeModalBtn = document.getElementById('closeModalBtn');

            const privacyContent = `
                <p>本网站不收集、存储或分享任何用户个人信息。所有访问数据仅用于统计分析，不会与第三方共享。</p>
                <p>我们使用 Cookie 来提升用户体验，但不会用于追踪个人身份。</p>
            `;
            const termsContent = `
                <p>本站内容均为个人原创或合法授权转载，未经允许不得商业使用。</p>
                <p>读者评论请遵守法律法规，文明发言。本站保留删除不当评论的权利。</p>
            `;

            document.getElementById('privacyLink').addEventListener('click', function(e) {
                e.preventDefault();
                modalTitle.textContent = '隐私政策';
                modalBody.innerHTML = privacyContent;
                modal.classList.remove('hidden');
            });
            document.getElementById('termsLink').addEventListener('click', function(e) {
                e.preventDefault();
                modalTitle.textContent = '使用条款';
                modalBody.innerHTML = termsContent;
                modal.classList.remove('hidden');
            });

            function closeLegalModal() {
                modal.classList.add('hidden');
            }
            closeModal.addEventListener('click', closeLegalModal);
            closeModalBtn.addEventListener('click', closeLegalModal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeLegalModal();
            });

            // ---------- 读取 URL 参数，自动筛选分类 ----------
            const urlParams = new URLSearchParams(window.location.search);
            const autoCategory = urlParams.get('category') || '';

            // ---------- 状态 ----------
            // 检查外部数据是否已加载
            if (typeof articlesData === 'undefined') {
                // 若未定义，显示错误并停止渲染
                document.getElementById('articlesGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        ⚠️ 数据文件加载失败，请确保 js/articles-data.js 存在
                    </div>
                `;
                document.getElementById('loadMoreBtn').classList.add('hidden');
                return; // 终止脚本
            }

            let state = {
                articles: articlesData,          // 直接使用外部数据
                displayedCount: 9,
                searchTerm: '',
                categoryFilter: autoCategory,
                sortOption: 'date-desc'
            };

            // 如果自动分类存在，同步下拉框
            if (autoCategory) {
                document.getElementById('categoryFilter').value = autoCategory;
            }

            // ---------- DOM 引用 ----------
            const grid = document.getElementById('articlesGrid');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            const searchInput = document.getElementById('searchInput');
            const categoryFilter = document.getElementById('categoryFilter');
            const sortBtn = document.getElementById('sortBtn');
            const sortDropdown = document.getElementById('sortDropdown');

            // ---------- 渲染函数 ----------
            function render() {
                // 过滤
                let filtered = state.articles.filter(a => {
                    const matchSearch = a.title.includes(state.searchTerm) || a.summary.includes(state.searchTerm);
                    const matchCategory = state.categoryFilter === '' || a.category === state.categoryFilter;
                    return matchSearch && matchCategory;
                });

                // 排序
                switch (state.sortOption) {
                    case 'date-desc': filtered.sort((a,b) => new Date(b.date) - new Date(a.date)); break;
                    case 'date-asc':  filtered.sort((a,b) => new Date(a.date) - new Date(b.date)); break;
                    case 'title-asc': filtered.sort((a,b) => a.title.localeCompare(b.title)); break;
                    case 'title-desc': filtered.sort((a,b) => b.title.localeCompare(a.title)); break;
                    default: break;
                }

                const total = filtered.length;
                const show = filtered.slice(0, state.displayedCount);

                if (show.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 dark:text-gray-400">没有找到匹配的文章</div>`;
                    loadMoreBtn.classList.add('hidden');
                    return;
                }

                grid.innerHTML = show.map(article => `
                    <div class="article-card bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100/80 dark:border-gray-700/50 overflow-hidden" data-aos="fade-up">
                        <div class="h-44 overflow-hidden bg-gray-100 dark:bg-gray-700">
                            <img src="${article.image}" alt="${article.title}" class="w-full h-full object-cover" onerror="this.src='https://picsum.photos/seed/fallback/400/300'" />
                        </div>
                        <div class="p-5">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-medium px-2 py-1 bg-sky-50 dark:bg-sky-900/40 text-primary rounded-full">${article.category}</span>
                                <span class="text-xs text-gray-400 dark:text-gray-400">${article.date}</span>
                            </div>
                            <h3 class="text-lg font-serif font-bold text-gray-800 dark:text-gray-100">${article.title}</h3>
                            <p class="text-gray-500 dark:text-gray-300 text-sm mt-1 line-clamp-2">${article.summary}</p>
                            <a href="${article.link}" class="mt-3 inline-block text-primary text-sm font-medium hover:text-blue-700 transition">
                                阅读全文 <i class="fa-solid fa-arrow-right ml-1"></i>
                            </a>
                        </div>
                    </div>
                `).join('');

                // 显示或隐藏加载更多
                if (show.length < total) {
                    loadMoreBtn.classList.remove('hidden');
                } else {
                    loadMoreBtn.classList.add('hidden');
                }

                // 重新触发 AOS
                AOS.refresh();
            }

            // ---------- 事件绑定 ----------
            searchInput.addEventListener('input', function() {
                state.searchTerm = this.value.trim();
                state.displayedCount = 9;
                render();
            });

            categoryFilter.addEventListener('change', function() {
                state.categoryFilter = this.value;
                state.displayedCount = 9;
                // 更新 URL 参数
                const url = new URL(window.location);
                if (state.categoryFilter) {
                    url.searchParams.set('category', state.categoryFilter);
                } else {
                    url.searchParams.delete('category');
                }
                window.history.replaceState({}, '', url);
                render();
            });

            sortBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                sortDropdown.classList.toggle('hidden');
            });
            document.addEventListener('click', function() {
                sortDropdown.classList.add('hidden');
            });
            document.querySelectorAll('.sort-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    state.sortOption = this.dataset.sort;
                    state.displayedCount = 9;
                    sortDropdown.classList.add('hidden');
                    const text = this.textContent.trim();
                    sortBtn.innerHTML = `<i class="fa-solid fa-sort mr-1"></i> ${text}`;
                    render();
                });
            });

            loadMoreBtn.addEventListener('click', function() {
                state.displayedCount += 9;
                render();
            });

            // 初始化渲染
            render();

            // 初始化 AOS
            AOS.init({ duration: 800, once: true });

        });
    </script>
</body>
</html>
