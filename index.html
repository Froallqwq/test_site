<!DOCTYPE html>
<html lang="zh-cn">
  <head>
	<style>
		.utterance{
			position: relative;
			box-sizing: border-box;
			width: 100%;
			max-width: 760px;
			margin-left: auto;
			margin-right: auto;
		}
		.utterance{
			color-scheme: light;
			position: absolute;
			left: 0;
			right: 0;
			width: 1px;
			min-width: 100%;
			height: 100%;
			border: 0;
		}
	</style>
	<style type="text/css">
		
	</style>	
	<meta http-equiv="content-language" content="zh-cn">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>博客</title>
	<style>
		#loading-box .loading-left-bg,
		#loading-box .loading-right-bg {
			position:fixed;
			z-index: 10000;
			width: 50%;
			height: 100%;
			background-color:#8EE5EE;
			transition:all 0.5s;
		}
		
		#loading-box .loading-right-bg{
			right:0;
		}
		
		#loading-box>.spinner-box {
			position: fixed;
			Z-index: 10001;
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 100vh;
		}
		
		#loading-box .spinner-box .configure-border-1
			{position: absolute;
			padding: 3px;
			width: 115px;
			height: 115px;
			background: #ffab91;
			animation: configure-clockwise 3s ease-in-out os infinite alternate;
		}
		
		#loading-box .spinner-box .configure-border-2
			{left: -115px;
			padding: 3px;
			width: 115px;
			height: 115px;
			background: rgb(63, 249, 220);
			transform: rotate(45deg);
			animation: configure-xclockwise 3s ease-in-out os infinite alternate;
		}
		
		#loading-box .spinner-box .loading-word 		{position: absolute;
			color:#ffffff;
			font-size:16px;
		}
		
		#loading-box .spinner-box .configure-core
			{width: 100%;
			height: 100%;
			background-color:#53868B;
		}
		
div.loaded div.loading-left-bg {
	transform: translate(-100%, 0);
		}
	
div.loaded div.loading-right-bg {
	transform: translate(100%, 0);
		}
		
div.loaded div.spinner-box {
	display: none !important;
		}
@keyframes configure-clockwise {
	0%{
		transform: rotate(o);
	}
	25% {
		transform: rotate(90deg);
	}
	
	50%{
		transform: rotate(180deg);
	}
	
	75% {
		transform: rotate(270deg);
	}
	
	100%{
		transform: rotate(360deg);
	}
	
	@keyframes configure-xclockwise {
		0%{
			transform: rotate(45deg);
		}
		25% {
			transform: rotate(-45deg);
		}
		50% {
			transform: rotate(-135deg);
		}
		75% {
			transform: rotate(-225deg);
		}
		100%{
			transform: rotate(-315deg);
		}
	}
	</style>
	  
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
	 
</body>
</html>
